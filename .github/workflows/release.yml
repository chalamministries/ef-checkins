name: Build Windows MSI on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: |
          choco install nsis --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Generate Icons
        run: npx @tauri-apps/cli@latest icon assets/icons/256x256.png

      - name: Build Installer
        run: npx @tauri-apps/cli@latest build --bundles nsis

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EF-Checkins-Installer
          path: "**/target/release/bundle/nsis/EF Checkins_*.exe"
          if-no-files-found: error
